async function fetchMarketStatus() {
  // All times shown in Cyprus time (UTC+3)
  const nowCY = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Nicosia"}));
  const dayCY  = nowCY.getDay();   // Cyprus local day
  const hourCY = nowCY.getHours(); // Cyprus local hour
  const minCY  = nowCY.getMinutes();
  const isWeekend = dayCY === 0 || dayCY === 6;
  // US market: 09:30-16:00 ET = 16:30-23:00 Cyprus (UTC+3)
  const cyOpen  = 16 * 60 + 30; // 16:30 Cyprus
  const cyClose = 23 * 60;       // 23:00 Cyprus
  const cyNow   = hourCY * 60 + minCY;
  const isMarketHours = !isWeekend && cyNow >= cyOpen && cyNow < cyClose;
  const isPreMarket   = !isWeekend && cyNow >= 11*60 && cyNow < cyOpen;
  const isAfterHours  = !isWeekend && (cyNow >= cyClose || cyNow < 11*60) && cyNow > 0;
  const days    = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  // Next session in Cyprus time labels
  const nextMap = {0:"Mon 16:30",1:"Tue 16:30",2:"Wed 16:30",3:"Thu 16:30",4:"Fri 16:30",5:"Mon 16:30",6:"Mon 16:30"};
  const openToday = isMarketHours ? "Open" : cyNow < cyOpen && !isWeekend ? `Today 16:30` : nextMap[dayCY];
  try {
    const res = await fetch(`https://finnhub.io/api/v1/stock/market-status?exchange=US&token=${FINNHUB_KEY}`);
    const d = await res.json();
    marketStatus = {
      isOpen: d.isOpen !== undefined ? d.isOpen : isMarketHours,
      session: d.isOpen ? "OPEN" : isPreMarket ? "PRE-MARKET" : isAfterHours ? "AFTER-HOURS" : "CLOSED",
      nextSession: openToday,
      day: days[dayCY],
    };
  } catch(e) {
    marketStatus = { isOpen: isMarketHours, session: isMarketHours ? "OPEN" : "CLOSED", nextSession: openToday };
  }
}

// ─── LIVE TECHNICAL INDICATOR ENGINE ─────────────────────────────────────────
// Calculates real RSI, MACD, Bollinger from actual candle data
function calcRealIndicators(candles) {
  if (!candles || !candles.c || candles.c.length < 20) return null;
  const closes = candles.c;
  const n = closes.length;

  // Real RSI-14
  const rsiPeriod = 14;
  let gains = 0, losses = 0;
  for (let i = n - rsiPeriod; i < n; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff > 0) gains += diff; else losses -= diff;
  }
  const avgGain = gains / rsiPeriod || 0.001;
  const avgLoss = losses / rsiPeriod || 0.001;
  const rsi = 100 - (100 / (1 + avgGain / avgLoss));

  // Real MACD
  const ema = (arr, p) => {
    const k = 2/(p+1); let prev = arr[0];
    for (let i = 1; i < arr.length; i++) prev = arr[i]*k + prev*(1-k);
    return prev;
  };
  const recentCloses = closes.slice(-30);
  const ema12 = ema(recentCloses, 12);
  const ema26 = ema(recentCloses, 26);
  const macdVal = ema12 - ema26;
  const macdSignal = ema(recentCloses.map((_,i,a) => i < 11 ? a[i] : ema(a.slice(0,i+1), 12) - ema(a.slice(0,i+1), 26)).slice(-9), 9);
  const macdBullish = macdVal > macdSignal;

  // Real Bollinger %B (20-period)
  const last20 = closes.slice(-20);
  const bbMean = last20.reduce((a,b) => a+b, 0) / 20;
  const bbStd = Math.sqrt(last20.reduce((a,b) => a+(b-bbMean)**2, 0) / 20);
  const bbUpper = bbMean + 2*bbStd;
  const bbLower = bbMean - 2*bbStd;
  const bbPct = bbStd > 0 ? ((closes[n-1] - bbLower) / (bbUpper - bbLower)) * 100 : 50;

  // Real momentum: 5-day and 20-day return
  const mom5d  = n >= 5  ? ((closes[n-1] - closes[n-6])  / closes[n-6]  * 100) : 0;
  const mom20d = n >= 20 ? ((closes[n-1] - closes[n-21]) / closes[n-21] * 100) : 0;

  // Volume trend: is recent volume above 20-day avg?
  const vols = candles.v || [];
  const avgVol20 = vols.slice(-20).reduce((a,b) => a+b, 0) / 20 || 1;
  const lastVol  = vols[vols.length-1] || 0;
  const volConfirm = lastVol > avgVol20 * 1.1; // 10% above average = confirmed

  // News sentiment from live headlines
  const newsItems = newsCache && newsCache[window._currentTicker] || [];
  const sentimentScore = newsItems.length > 0 ? (() => {
    const bullWords = ["beat","record","growth","surge","rise","strong","profit","upgrade","buy","gains","high","positive","above","exceed"];
    const bearWords = ["miss","decline","fall","loss","cut","weak","below","risk","concern","sell","downgrade","drop","negative","warns"];
    let score = 0;
    newsItems.forEach(n => {
      const text = (n.headline + " " + (n.summary||"")).toLowerCase();
      bullWords.forEach(w => { if (text.includes(w)) score++; });
      bearWords.forEach(w => { if (text.includes(w)) score--; });
    });
    return Math.max(-5, Math.min(5, score)); // -5 to +5
  })() : 0;

  // Earnings proximity penalty: if earnings within 7 days, uncertainty is higher
  const earningsItems = earningsCache && earningsCache[window._currentTicker] || [];
  const earningsProximity = false; // Would need calendar endpoint

  return { rsi, macdBullish, bbPct, mom5d, mom20d, volConfirm, sentimentScore };
}

// Enhanced short-term forecast using real technical data
function enhancedForecast(ticker, currentPrice, quantComp) {
  const candles = window._candleCache && window._candleCache[ticker];
  const realInd = calcRealIndicators(candles);

  if (!realInd) {
    // Fallback to quant-based estimate
    const adjCAGR = (quantComp - 50) / 100 * 0.3;
    return {
      day: parseFloat((currentPrice * (1 + adjCAGR/252)).toFixed(2)),
      week: parseFloat((currentPrice * (1 + adjCAGR/52)).toFixed(2)),
      confidence: 52,
      signals: []
    };
  }

  // Build composite short-term signal
  let signal = 0;
  const signals = [];

  // RSI signal
  if (realInd.rsi < 30) { signal += 2; signals.push({s:"RSI oversold — potential bounce",c:"#34d399"}); }
  else if (realInd.rsi > 70) { signal -= 2; signals.push({s:"RSI overbought — potential pullback",c:"#f87171"}); }
  else if (realInd.rsi > 55) { signal += 1; signals.push({s:"RSI bullish momentum",c:"#a3e635"}); }
  else if (realInd.rsi < 45) { signal -= 1; signals.push({s:"RSI bearish momentum",c:"#f97316"}); }

  // MACD signal
  if (realInd.macdBullish) { signal += 1; signals.push({s:"MACD bullish crossover",c:"#34d399"}); }
  else { signal -= 1; signals.push({s:"MACD bearish crossover",c:"#f87171"}); }

  // Bollinger signal
  if (realInd.bbPct < 20) { signal += 2; signals.push({s:"Near lower Bollinger Band — bounce zone",c:"#34d399"}); }
  else if (realInd.bbPct > 80) { signal -= 2; signals.push({s:"Near upper Bollinger Band — stretched",c:"#f87171"}); }

  // Momentum
  if (realInd.mom5d > 2) { signal += 1; signals.push({s:`+${realInd.mom5d.toFixed(1)}% 5-day momentum`,c:"#34d399"}); }
  else if (realInd.mom5d < -2) { signal -= 1; signals.push({s:`${realInd.mom5d.toFixed(1)}% 5-day decline`,c:"#f87171"}); }

  // Volume confirmation
  if (realInd.volConfirm && signal > 0) { signal += 0.5; signals.push({s:"Above-avg volume confirms move",c:"#34d399"}); }
  else if (realInd.volConfirm && signal < 0) { signal -= 0.5; signals.push({s:"Above-avg volume confirms decline",c:"#f87171"}); }

  // News sentiment
  if (realInd.sentimentScore > 2) { signal += 1; signals.push({s:"Positive news sentiment",c:"#34d399"}); }
  else if (realInd.sentimentScore < -2) { signal -= 1; signals.push({s:"Negative news sentiment",c:"#f87171"}); }

  // Quant score overlay
  if (quantComp >= 65) signal += 0.5;
  else if (quantComp <= 35) signal -= 0.5;

  // Convert signal to price prediction
  const dailyMove = signal * 0.15; // Each signal unit = ~0.15% daily move
  const weeklyMove = signal * 0.4;
  const confidence = Math.min(72, 52 + Math.abs(signal) * 2.5); // Max 72% confidence

  return {
    day:  parseFloat((currentPrice * (1 + dailyMove/100)).toFixed(2)),
    week: parseFloat((currentPrice * (1 + weeklyMove/100)).toFixed(2)),
    dayPct: parseFloat(dailyMove.toFixed(2)),
    weekPct: parseFloat(weeklyMove.toFixed(2)),
    confidence: Math.round(confidence),
    signals,
    realData: true
  };
}

// ─── QUANT ENGINE ─────────────────────────────────────────────────────────────
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function computeQuant(ticker,price,livePrices){
  const s=DB[ticker];
  // Live momentum boost from actual daily change
  const liveChg=(livePrices&&livePrices[ticker])?livePrices[ticker].changePct||0:0;
  const vals=Object.values(s.r);
  const n=vals.length;
  const avg10=vals.reduce((a,b)=>a+b,0)/n;
  const avgR3=(s.r[2022]+s.r[2023]+s.r[2024])/3;
  const upYrs=vals.filter(v=>v>0).length;
  const rsi=clamp((upYrs/n)*100*0.6+50*0.4+s.r[2024]/12*0.5,10,90);
  const mean=avg10,std=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/n);
  const bbPct=clamp((s.r[2024]-(mean-2*std))/(4*std)*100,0,100);
  const recentVol=Math.sqrt([s.r[2022],s.r[2023],s.r[2024]].reduce((a,b)=>a+b**2,0)/3)*0.5;
  const volRegime=recentVol>s.vol?"💥 Expanding":recentVol<s.vol*0.8?"🧊 Compressing":"➡️ Stable";
  let tS=50;
  if(price>price*(1+avg10/100*0.4))tS+=15;
  if(price>price*(1+avg10/100*0.8))tS+=15;
  if(avg10>0)tS+=10;
  if(s.r[2024]>20)tS+=10;else if(s.r[2024]<-10)tS-=15;
  tS=clamp(tS,5,95);
  let mS=50;
  if(rsi<30)mS+=20;else if(rsi>70)mS-=15;
  if(s.r[2024]/12>2)mS+=10;else if(s.r[2024]/12<-2)mS-=10;
  mS=clamp(mS,5,95);
  const vS=clamp(clamp(100-s.vol*1.1,5,90)+(volRegime.includes("Comp")?8:0)+(volRegime.includes("Exp")?-10:0),5,95);
  const spePE=SECTOR_PE[s.s]||22;
  const fS=clamp((spePE/Math.max(s.pe,1))*50+25+(s.rg>0?Math.min(s.rg,50)*0.5:0)+(s.fcf||0)*2,5,95);
  const maS=clamp(65*0.25+(s.beta<=1?60:clamp(60-(s.beta-1)*20,20,60))*0.25+(s.rs==="pos"?70:s.rs==="low"?62:s.rs==="med"?50:35)*0.25+(s.ss||60)*0.25,5,95);
  const liveBoost=Math.max(-8,Math.min(8,liveChg*1.5)); // live daily change ±8 pts max
  const comp=Math.min(100,Math.max(0,Math.round(tS*0.25+mS*0.20+vS*0.15+fS*0.25+maS*0.15+liveBoost)));
  const sig=comp>=75?{l:"Strong Buy",c:"#34d399",bg:"rgba(52,211,153,0.1)",e:"🚀"}:comp>=60?{l:"Buy",c:"#a3e635",bg:"rgba(163,230,53,0.1)",e:"📈"}:comp>=45?{l:"Neutral",c:"#fbbf24",bg:"rgba(251,191,36,0.1)",e:"😐"}:comp>=30?{l:"Sell",c:"#f97316",bg:"rgba(249,115,22,0.1)",e:"📉"}:{l:"Strong Sell",c:"#f87171",bg:"rgba(248,113,113,0.1)",e:"🔴"};
  const ps2=[tS,mS,vS,fS,maS];
  const pm=ps2.reduce((a,b)=>a+b,0)/5;
  const conf=Math.round(clamp(100-Math.sqrt(ps2.reduce((a,b)=>a+(b-pm)**2,0)/5)*1.2,30,95));
  const adjCAGR=clamp((avg10*0.4+avgR3*0.35+(comp-50)*0.5)/100,-0.20,0.50);
  const rar=parseFloat(((adjCAGR*100)/(s.vol/100)).toFixed(2));
  const p1Y=parseFloat((price*(1+adjCAGR)).toFixed(2));
  const p1M=parseFloat((price*(1+adjCAGR/12)).toFixed(2));
  const p3M=parseFloat((price*(1+adjCAGR/4)).toFixed(2));
  const p1D=parseFloat((price*(1+adjCAGR/252)).toFixed(2));
  const p1W=parseFloat((price*(1+adjCAGR/52)).toFixed(2));
  const wk=[];let pw=price;
  for(let w=0;w<=52;w++){pw*=(1+adjCAGR/52);wk.push(parseFloat(pw.toFixed(2)));}
  const note=comp>=70?`${ticker} scores ${comp}/100 — all pillars aligned. Strong trend and solid fundamentals.`:comp>=55?`${ticker} scores ${comp}/100 — more bullish than bearish. Decent trend with some headwinds.`:comp>=40?`${ticker} scores ${comp}/100 — mixed signals. Equal upside and downside risk.`:`${ticker} scores ${comp}/100 — multiple pillars flashing caution. Wait for better entry.`;
  return{comp,sig,conf,rar,tS:Math.round(tS),mS:Math.round(mS),vS:Math.round(vS),fS:Math.round(fS),maS:Math.round(maS),rsi:Math.round(rsi),bbPct:Math.round(bbPct),volRegime,p1D,p1W,p1M,p3M,p1Y,wk,note,adjCAGR,avg10:avg10.toFixed(1)};
}

  );
}

// ─── ANALYST CHART ────────────────────────────────────────────────────────────
function AnalystChart({returns,vol,currentPrice,ticker,timeframe,chartType,overlays}){
  // ── Build price series from annual returns ──────────────────────────────────
  const allE=Object.entries(returns).filter(([,v])=>v!==0).sort((a,b)=>+a[0]-+b[0]);
  let sp=currentPrice;
  for(let i=allE.length-1;i>=0;i--)sp=sp/(1+allE[i][1]/100);
  let pr=sp;
  let _seed=ticker.split("").reduce((a,c)=>a+c.charCodeAt(0),0)*31337;
  const srng=()=>{_seed=(_seed*1664525+1013904223)%4294967296;return _seed/4294967296;};
  const allC=allE.map(([yr,ret])=>{
    const o=pr,cl=pr*(1+ret/100),sw=Math.abs(ret)/100*(vol/100)*2.5;
    const h=Math.max(o,cl)*(1+sw),l=Math.min(o,cl)*(1-sw),v=Math.abs(ret)*(1+srng()*0.3);
    pr=cl;return{yr,open:o,close:cl,high:h,low:l,volume:v,up:cl>=o};
  });
  const sub=[];
  allC.forEach(c=>{
    const mr=(c.close/c.open)**(1/12)-1;let p=c.open;
    for(let m=0;m<12;m++){
      const mO=p,mC=p*(1+mr*(0.8+srng()*0.4)),ms=vol/100/Math.sqrt(252)*5;
      sub.push({yr:`${c.yr}-${String(m+1).padStart(2,"0")}`,open:mO,close:mC,
        high:Math.max(mO,mC)*(1+ms),low:Math.min(mO,mC)*(1-ms),
        volume:c.volume*(0.7+srng()*0.6),up:mC>=mO});
      p=mC;
    }
  });

  const disp   = timeframe==="1Y" ? sub.slice(-12) : sub;
  const n      = disp.length;
  const closes = disp.map(c=>c.close);

  // ── Indicator calculations ──────────────────────────────────────────────────
  const sma=(arr,p)=>arr.map((_,i)=>i<p-1?null:arr.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p);
  const ema=(arr,p)=>{const k=2/(p+1);let pv=null;return arr.map(v=>{pv=pv===null?v:v*k+pv*(1-k);return pv;});};

  const ma50  = sma(closes,Math.min(50,Math.floor(n*0.4)));
  const ma200 = sma(closes,Math.min(200,Math.floor(n*0.8)));
  const bbP   = Math.min(20,Math.floor(n*0.3));
  const bbMid = sma(closes,bbP);
  const bbUp  = bbMid.map((m,i)=>{if(!m)return null;const sl=closes.slice(Math.max(0,i-bbP+1),i+1),sd=Math.sqrt(sl.reduce((a,b)=>a+(b-m)**2,0)/sl.length);return m+2*sd;});
  const bbLo  = bbMid.map((m,i)=>{if(!m)return null;const sl=closes.slice(Math.max(0,i-bbP+1),i+1),sd=Math.sqrt(sl.reduce((a,b)=>a+(b-m)**2,0)/sl.length);return m-2*sd;});

  const e12=ema(closes,12),e26=ema(closes,26);
  const macdLine=e12.map((v,i)=>v-e26[i]);
  const sigLine =ema(macdLine,9);
  const histLine=macdLine.map((v,i)=>v-sigLine[i]);

  const rsiLine=closes.map((_,i)=>{
    if(i<14)return 50;
    const s=closes.slice(i-14,i);
    let g=0,l2=0;
    for(let j=1;j<s.length;j++){const d=s[j]-s[j-1];if(d>0)g+=d;else l2-=d;}
    return 100-100/(1+(g/14||0.001)/(l2/14||0.001));
  });

  const volMax  = Math.max(...disp.map(c=>c.volume),1);
  const priceMin= Math.min(...disp.map(c=>c.low))*0.98;
  const priceMax= Math.max(...disp.map(c=>c.high))*1.02;

  // MACD scale — always include 0
  const allMacd=[...macdLine,...sigLine,...histLine,0];
  const macdMin=Math.min(...allMacd),macdMax=Math.max(...allMacd);
  const macdPad=(macdMax-macdMin)*0.12;
  const macdYmin=macdMin-macdPad, macdYmax=macdMax+macdPad;

  // ── Chart layout constants ───────────────────────────────────────────────────
  const W=560,L=52,R=22,T=8,B=22;
  const cW=W-L-R;
  const bW=Math.max((cW/n)*0.55,1.5);
  const px=i=>L+(i+0.5)*(cW/n);
  const step=Math.ceil(n/8);
  const fmtX=i=>{const d=disp[i];return timeframe==="1Y"?d.yr.slice(5):d.yr.slice(0,4);};

  // ── Coordinate functions per chart height ───────────────────────────────────
  const pyFn=(yMin,yMax,CH)=>v=>T+CH-((v-yMin)/((yMax-yMin)||1))*CH;

  // ── Path builder ────────────────────────────────────────────────────────────
  const pathOf=(data,pyF)=>data.reduce((acc,v,i)=>{
    if(v===null)return acc;
    const prev=i>0?data.slice(0,i).reverse().find(x=>x!==null):undefined;
    return acc+(prev===undefined?"M":"L")+" "+px(i).toFixed(1)+" "+pyF(v).toFixed(1)+" ";
  },"");

  // ── Reusable chart panel ─────────────────────────────────────────────────────
  const Panel=({title,titleColor,CH,yMin,yMax,yTicks,showX,children})=>{
    const pyF=pyFn(yMin,yMax,CH);
    const svgH=T+CH+B;
    return(
      <div style={{background:"#0a1421",border:"1px solid #101c2e",borderRadius:12,marginBottom:8,overflow:"hidden"}}>
        <div style={{padding:"7px 14px 0",fontFamily:"Avenir Next,sans-serif",fontWeight:700,fontSize:11,color:titleColor,textTransform:"uppercase",letterSpacing:"0.07em"}}>{title}</div>
        <svg width="100%" viewBox={"0 0 "+W+" "+svgH} style={{display:"block"}}>
          {yTicks.map((v,i)=>(
            <g key={i}>
              <line x1={L} y1={pyF(v).toFixed(1)} x2={W-R} y2={pyF(v).toFixed(1)} stroke="#1a2e42" strokeWidth="1" strokeDasharray="3,4"/>
              <text x={L-4} y={(pyF(v)+3).toFixed(1)} textAnchor="end" fontSize="7" fill="#4a5568" fontFamily="Avenir Next,sans-serif">
                {Math.abs(v)>=1000?(v/1000).toFixed(1)+"k":Math.abs(v)>=1?v.toFixed(1):v.toFixed(3)}
              </text>
            </g>
          ))}
          {showX&&disp.map((c,i)=>{
            if(i%step!==0)return null;
            return <text key={i} x={px(i).toFixed(1)} y={T+CH+B-3} textAnchor="middle" fontSize="7" fill="#4a5568" fontFamily="Avenir Next,sans-serif">{fmtX(i)}</text>;
          })}
          {children(pyF)}
        </svg>
      </div>
    );
  };

  // ── Pre-compute BB paths (avoid IIFE in JSX) ─────────────────────────────────
  const pyPrice=pyFn(priceMin,priceMax,180);
  const bbUpPath =pathOf(bbUp, pyPrice);
  const bbLoPath =pathOf(bbLo, pyPrice);
  const bbLoRev  =[...bbLo].reverse().reduce((acc,v,i)=>{
    if(!v)return acc;
    const oi=bbLo.length-1-i;
    const prev=[...bbLo].reverse().slice(0,i).find(x=>x);
    return acc+(prev===undefined?"M":"L")+" "+px(oi).toFixed(1)+" "+pyPrice(v).toFixed(1)+" ";
  },"");

  // Determine which panel is last (for X-axis labels)
  const isLastVol  = overlays.vol && !overlays.macd && !overlays.rsi;
  const isLastMacd = overlays.macd && !overlays.rsi;
  const isLastRsi  = overlays.rsi;
  const isLastPrice= !overlays.vol && !overlays.macd && !overlays.rsi;

  return(
    <div>

      {/* ── 1. PRICE ── */}
      <Panel title={ticker+" · "+timeframe+" · "+(chartType==="line"?"Line":chartType==="bar"?"OHLC":"Candlestick")}
        titleColor="#38bdf8" CH={180} yMin={priceMin} yMax={priceMax}
        yTicks={Array.from({length:5},(_,i)=>priceMin+((priceMax-priceMin)*i/4))}
        showX={isLastPrice}>
        {(pyF)=>(
          <>
            {overlays.bb&&(
              <>
                <path d={bbUpPath+" "+bbLoRev+" Z"} fill="#fbbf2410"/>
                <path d={bbUpPath} fill="none" stroke="#fbbf24" strokeWidth="1" strokeDasharray="3,3" opacity="0.7"/>
                <path d={bbLoPath} fill="none" stroke="#fbbf24" strokeWidth="1" strokeDasharray="3,3" opacity="0.7"/>
                <path d={pathOf(bbMid,pyF)} fill="none" stroke="#fbbf2444" strokeWidth="1"/>
              </>
            )}
            {overlays.ma200&&<path d={pathOf(ma200,pyF)} fill="none" stroke="#818cf8" strokeWidth="1.5" opacity="0.85"/>}
            {overlays.ma50 &&<path d={pathOf(ma50, pyF)} fill="none" stroke="#38bdf8" strokeWidth="1.5"/>}
            {chartType==="line"
              ? <path d={pathOf(closes,pyF)} fill="none" stroke="#38bdf8" strokeWidth="2"/>
              : disp.map((c,i)=>{
                  const col=c.up?"#34d399":"#f87171";
                  const top=Math.min(pyF(c.open),pyF(c.close));
                  const bot=Math.max(pyF(c.open),pyF(c.close));
                  const bh=Math.max(bot-top,1.5);
                  return(
                    <g key={i}>
                      <line x1={px(i).toFixed(1)} y1={pyF(c.high).toFixed(1)} x2={px(i).toFixed(1)} y2={pyF(c.low).toFixed(1)} stroke={col} strokeWidth="1"/>
                      <rect x={(px(i)-bW/2).toFixed(1)} y={top.toFixed(1)} width={bW.toFixed(1)} height={bh.toFixed(1)}
                        fill={chartType==="bar"?"none":col} stroke={col} strokeWidth="0.7" fillOpacity="0.85" rx="0.5"/>
                    </g>
                  );
                })
            }
          </>
        )}
      </Panel>

      {/* ── 2. VOLUME ── */}
      {overlays.vol&&(
        <Panel title="Volume" titleColor="#34d399" CH={55} yMin={0} yMax={volMax}
          yTicks={[0,volMax*0.5,volMax]}
          showX={isLastVol}>
          {(pyF)=>(
            <>
              {disp.map((c,i)=>{
                const top=pyF(c.volume);
                const bot=pyF(0);
                return <rect key={i} x={(px(i)-bW/2).toFixed(1)} y={top.toFixed(1)} width={bW.toFixed(1)} height={Math.max(bot-top,0.5).toFixed(1)} fill={c.up?"#34d39966":"#f8717166"} rx="0.5"/>;
              })}
            </>
          )}
        </Panel>
      )}

      {/* ── 3. MACD ── */}
      {overlays.macd&&(
        <Panel title="MACD (12/26/9)  ·  Orange=MACD  ·  Pink=Signal  ·  Bars=Histogram"
          titleColor="#f97316" CH={80} yMin={macdYmin} yMax={macdYmax}
          yTicks={[macdYmin,(macdYmin+macdYmax)/2,macdYmax]}
          showX={isLastMacd}>
          {(pyF)=>(
            <>
              <line x1={L} y1={pyF(0).toFixed(1)} x2={W-R} y2={pyF(0).toFixed(1)} stroke="#334155" strokeWidth="1.5"/>
              {histLine.map((v,i)=>{
                const z=pyF(0);
                const y=pyF(v);
                const top=Math.min(y,z);
                const bot=Math.max(y,z);
                return <rect key={i} x={(px(i)-bW/2).toFixed(1)} y={top.toFixed(1)} width={bW.toFixed(1)} height={Math.max(bot-top,0.5).toFixed(1)} fill={v>=0?"#34d39966":"#f8717166"} rx="0.5"/>;
              })}
              <path d={pathOf(macdLine,pyF)} fill="none" stroke="#f97316" strokeWidth="2" strokeLinejoin="round"/>
              <path d={pathOf(sigLine, pyF)} fill="none" stroke="#f472b6" strokeWidth="1.5" strokeDasharray="5,3" strokeLinejoin="round"/>
              <rect x={L+4}   y={T+4} width={10} height={2} fill="#f97316" rx="1"/>
              <text x={L+18}  y={T+8} fontSize="7" fill="#f97316" fontFamily="Avenir Next,sans-serif">MACD</text>
              <rect x={L+50}  y={T+4} width={10} height={2} fill="#f472b6" rx="1"/>
              <text x={L+64}  y={T+8} fontSize="7" fill="#f472b6" fontFamily="Avenir Next,sans-serif">Signal</text>
              <rect x={L+96}  y={T+3} width={8}  height={5} fill="#34d39966" rx="1"/>
              <text x={L+108} y={T+8} fontSize="7" fill="#94a3b8" fontFamily="Avenir Next,sans-serif">Histogram</text>
            </>
          )}
        </Panel>
      )}

      {/* ── 4. RSI ── */}
      {overlays.rsi&&(
        <Panel title={"RSI (14)  ·  Current: "+rsiLine[rsiLine.length-1].toFixed(1)+"  ·  >70 Overbought  ·  <30 Oversold"}
          titleColor="#f472b6" CH={90} yMin={0} yMax={100}
          yTicks={[0,30,50,70,100]}
          showX={isLastRsi}>
          {(pyF)=>(
            <>
              <rect x={L} y={pyF(100).toFixed(1)} width={cW} height={Math.max(pyF(70)-pyF(100),0).toFixed(1)} fill="#f8717110"/>
              <rect x={L} y={pyF(30).toFixed(1)}  width={cW} height={Math.max(pyF(0) -pyF(30), 0).toFixed(1)} fill="#34d39910"/>
              <line x1={L} y1={pyF(70).toFixed(1)} x2={W-R} y2={pyF(70).toFixed(1)} stroke="#f87171" strokeWidth="1" strokeDasharray="4,3" opacity="0.7"/>
              <line x1={L} y1={pyF(50).toFixed(1)} x2={W-R} y2={pyF(50).toFixed(1)} stroke="#475569" strokeWidth="0.8" strokeDasharray="2,5"/>
              <line x1={L} y1={pyF(30).toFixed(1)} x2={W-R} y2={pyF(30).toFixed(1)} stroke="#34d399" strokeWidth="1" strokeDasharray="4,3" opacity="0.7"/>
              <text x={W-R+3} y={(pyF(70)+3).toFixed(1)} fontSize="7" fill="#f87171" fontFamily="Avenir Next,sans-serif" fontWeight="700">70</text>
              <text x={W-R+3} y={(pyF(50)+3).toFixed(1)} fontSize="7" fill="#4a5568" fontFamily="Avenir Next,sans-serif">50</text>
              <text x={W-R+3} y={(pyF(30)+3).toFixed(1)} fontSize="7" fill="#34d399" fontFamily="Avenir Next,sans-serif" fontWeight="700">30</text>
              <path d={pathOf(rsiLine,pyF)} fill="none" stroke="#f472b6" strokeWidth="2" strokeLinejoin="round"/>
              <circle cx={px(rsiLine.length-1).toFixed(1)} cy={pyF(rsiLine[rsiLine.length-1]).toFixed(1)} r="3.5" fill="#f472b6"/>
            </>
          )}
        </Panel>
      )}

    </div>
  );
}


// ── LiveCandleChart — model-based (no external API needed) ─────────────────────
function LiveCandleChart({ticker, timeframe, overlays, chartType}) {
  const s = DB[ticker];
  const vol = s.vol / 100;
  const entries = Object.entries(s.r).sort((a,b)=>+a[0]-+b[0]);

  // Build price series from annual returns
  let startP = DB[ticker].baseP;
  for(let i=entries.length-1;i>=0;i--) startP = startP/(1+entries[i][1]/100);

  // Generate daily candles
  const allCandles = [];
  let p = startP;
  entries.forEach(([yr,ret]) => {
    const dailyDrift = ret/100/252;
    const dailySig   = vol/Math.sqrt(252);
    let seed = yr.charCodeAt(0)*7+ticker.charCodeAt(0)*3;
    const rng = () => { seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; };
    for(let d=0;d<252;d++){
      const move = dailyDrift + (rng()-0.5)*2*dailySig;
      const o=p, c2=o*(1+move);
      const hs=vol/Math.sqrt(252)*0.5;
      allCandles.push({
        o, c:c2,
        h:Math.max(o,c2)*(1+rng()*hs),
        l:Math.min(o,c2)*(1-rng()*hs),
        v:Math.abs(move)*1e7*(0.5+rng()),
        t:Math.floor(new Date(yr+"-01-01").getTime()/1000)+d*86400
      });
      p=c2;
    }
  });

  const counts={"1W":7,"1M":30,"6M":130,"1Y":252,"5Y":1260};
  const candles=allCandles.slice(-(counts[timeframe]||30));
  const n=candles.length;
  if(!n) return <div style={{color:"#f87171",padding:20}}>No data</div>;

  const W=580,CH=195,VH=45,MH=65,RH=55,PAD={l:52,r:14,t:14,b:22};
  const mnP=Math.min(...candles.map(c=>c.l))*0.998;
  const mxP=Math.max(...candles.map(c=>c.h))*1.002;
  const pR=mxP-mnP||1;
  const cW=W-PAD.l-PAD.r, bW=Math.max((cW/n)*0.6,1.5);
  const px=i=>PAD.l+(i+0.5)*(cW/n), py=v=>PAD.t+CH-((v-mnP)/pR)*CH;
  const cls=candles.map(c=>c.c);
  const sma=(arr,p2)=>arr.map((_,i)=>i<p2-1?null:arr.slice(i-p2+1,i+1).reduce((a,b)=>a+b,0)/p2);
  const ma50=sma(cls,Math.min(50,n));
  const emaf=(arr,p2)=>{const k=2/(p2+1);let pv=arr[0];return arr.map(v=>{pv=v*k+pv*(1-k);return pv;});};
  const e12=emaf(cls,12),e26=emaf(cls,26),ml=e12.map((v,i)=>v-e26[i]),sl=emaf(ml,9),mh=ml.map((v,i)=>v-sl[i]);
  const mhMx=Math.max(...mh.map(Math.abs))||1;
  const rsiV=cls.map((_,i)=>{
    if(i<14)return 50;
    const seg=cls.slice(i-14,i);let g=0,l2=0;
    for(let j=1;j<seg.length;j++){const d=seg[j]-seg[j-1];if(d>0)g+=d;else l2-=d;}
    return 100-100/(1+(g/14||0.001)/(l2/14||0.001));
  });
  const mxV=Math.max(...candles.map(c=>c.v))||1;
  const yLbls=Array.from({length:5},(_,i)=>mnP+(pR*i)/4);
  const bbM=sma(cls,Math.min(20,n));
  const bbU=bbM.map((m,i)=>{if(!m)return null;const sg=cls.slice(Math.max(0,i-20+1),i+1),sd=Math.sqrt(sg.reduce((a,b)=>a+(b-m)**2,0)/sg.length);return m+2*sd;});
  const bbL=bbM.map((m,i)=>{if(!m)return null;const sg=cls.slice(Math.max(0,i-20+1),i+1),sd=Math.sqrt(sg.reduce((a,b)=>a+(b-m)**2,0)/sg.length);return m-2*sd;});
  const lp=(data,pyF)=>data.reduce((path,v,i)=>{if(v===null)return path;const pv=data.slice(0,i).reverse().find(x=>x!==null);return path+(pv===undefined?"M":"L")+" "+px(i).toFixed(1)+" "+pyF(v).toFixed(1)+" ";},"");
  const fmtD=ts=>{const d=new Date(ts*1000);return (d.getMonth()+1)+"/"+d.getDate();};
  const step=Math.ceil(n/8);
  let yOff=CH+PAD.t+PAD.b;
  const vY=yOff;if(overlays.vol)yOff+=VH+8;
  const mY=yOff;if(overlays.macd)yOff+=MH+8;
  const rY=yOff;
  const totH=yOff+(overlays.rsi?RH+8:0);

  return(
    <div style={{background:"#0a1421",border:"1px solid #101c2e",borderRadius:14,padding:"14px 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={{fontSize:11,color:"#fbbf24",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em"}}>
          🧮 {ticker} · Model Chart · {timeframe} · {n} bars
        </span>
        <span style={{fontSize:11,color:"#94a3b8"}}>Generated from annual returns + volatility model</span>
      </div>
      <div style={{fontSize:11,color:"#94a3b8",background:"rgba(251,191,36,0.05)",border:"1px solid rgba(251,191,36,0.12)",borderRadius:6,padding:"5px 10px",marginBottom:10}}>
        ⚠️ Short-term charts use model simulation. Real intraday data requires a paid data API. 1Y and 5Y use the same model as the Forecast tab.
      </div>
      <svg width="100%" viewBox={"0 0 "+W+" "+totH} style={{overflow:"visible",display:"block"}}>
        {yLbls.map((v,i)=>(<g key={i}><line x1={PAD.l} y1={py(v).toFixed(1)} x2={W-PAD.r} y2={py(v).toFixed(1)} stroke="#1a2538" strokeWidth="1"/><text x={PAD.l-4} y={(py(v)+3).toFixed(1)} textAnchor="end" fontSize="7" fill="#94a3b8">{"$"+v.toFixed(0)}</text></g>))}
        {overlays.bb&&(<><path d={lp(bbU,py)} fill="none" stroke="#fbbf24" strokeWidth="1" strokeDasharray="3,3" opacity="0.6"/><path d={lp(bbL,py)} fill="none" stroke="#fbbf24" strokeWidth="1" strokeDasharray="3,3" opacity="0.6"/></>)}
        {overlays.ma200&&<path d={lp(sma(cls,Math.min(200,n)),py)} fill="none" stroke="#818cf8" strokeWidth="1.5" opacity="0.8"/>}
        {overlays.ma50&&<path d={lp(ma50,py)} fill="none" stroke="#38bdf8" strokeWidth="1.5" opacity="0.9"/>}
        {chartType==="line"?<path d={lp(cls,py)} fill="none" stroke="#38bdf8" strokeWidth="2"/>:candles.map((c,i)=>{
          const col=c.c>=c.o?"#34d399":"#f87171";
          const bT=Math.min(py(c.o),py(c.c)),bB=Math.max(py(c.o),py(c.c)),bH=Math.max(bB-bT,1.5);
          return(<g key={i}><line x1={px(i).toFixed(1)} y1={py(c.h).toFixed(1)} x2={px(i).toFixed(1)} y2={py(c.l).toFixed(1)} stroke={col} strokeWidth="1"/><rect x={(px(i)-bW/2).toFixed(1)} y={bT.toFixed(1)} width={bW.toFixed(1)} height={bH.toFixed(1)} fill={chartType==="bar"?"none":col} stroke={col} strokeWidth="0.8" fillOpacity={0.85} rx="0.5"/></g>);

    {v:66, label:"66 — COVID peak", c:"#f87171"},
    {v:35, label:"35 — CRISIS", c:"#fbbf24"},
    {v:25, label:"25 — RISK_OFF", c:"#38bdf8"},
  ];

  const W = 900, H = 280, PAD_L = 42, PAD_R = 12, PAD_T = 16, PAD_B = 32;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const maxVix = 90;

  const toX = i => PAD_L + (i / Math.max(1, vixData.length - 1)) * plotW;
  const toY = v => PAD_T + plotH - (Math.min(v, maxVix) / maxVix) * plotH;

  // Build path — 435 points, no subsampling needed, always include last point
  const linePath = vixData.map((d,i)=>`${i===0?"M":"L"}${toX(i).toFixed(1)},${toY(d.val).toFixed(1)}`).join(" ");

  // Date to X position
  const dateToX = dateStr => {
    if(!vixData.length) return PAD_L;
    const idx = vixData.findIndex(d=>d.date>=dateStr);
    const i = idx<0 ? vixData.length-1 : idx;
    return PAD_L + (i/(vixData.length-1))*plotW;
  };

  // X axis labels — one per 5 years
  const xLabels = [];
  for(let y=1990; y<=2026; y+=5) {
    const dateStr = `${y}-01-01`;
    if(vixData.length) {
      const x = dateToX(dateStr);
      xLabels.push({x, label:String(y)});
    }
  }

  return(
    <div style={{background:"#0a1421",border:"1px solid #101c2e",borderRadius:14,padding:"20px 22px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:12}}>
        <div>
          <div style={{fontFamily:"Avenir Next,sans-serif",fontWeight:800,fontSize:15,color:"#e2e8f0"}}>
            📈 VIX Daily — Every Crisis Since 1990
          </div>
          <div style={{fontSize:11,color:"#475569",marginTop:3}}>
            {loading?"Loading daily VIX from FRED…":error?error:`435 monthly observations 1990–2026 · Source: CBOE · Live VIX appended · Click any shaded zone`}
          </div>
        </div>
        {liveVix&&(
          <div style={{background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.3)",borderRadius:8,padding:"6px 14px",textAlign:"center",flexShrink:0}}>
            <div style={{fontSize:10,color:"#475569",marginBottom:2}}>LIVE VIX</div>
            <div style={{fontFamily:"Avenir Next,sans-serif",fontWeight:800,fontSize:20,color:liveVix>35?"#f87171":liveVix>25?"#fbbf24":"#34d399"}}>{liveVix.toFixed(1)}</div>
            <div style={{fontSize:9,color:"#475569",marginTop:1}}>{liveVix>35?"🚨 CRISIS":liveVix>25?"⚠️ RISK_OFF":liveVix>18?"🟡 CAUTION":"🟢 RISK_ON"}</div>
          </div>
        )}
      </div>

      {loading&&<div style={{height:280,display:"flex",alignItems:"center",justifyContent:"center",color:"#334155",fontSize:13}}>Loading 35 years of daily VIX data from FRED…</div>}
      {error&&<div style={{height:280,display:"flex",alignItems:"center",justifyContent:"center",color:"#f87171",fontSize:13}}>{error}</div>}

      {!loading&&!error&&vixData.length>0&&(
        <div style={{overflowX:"auto"}}>
          <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:600,height:"auto",display:"block"}}>

            {/* Crisis shaded zones */}
            {crisisZones.map((z,i)=>{
              const x1 = dateToX(z.start);
              const x2 = dateToX(z.end);
              const isSelected = crisisSelected===z.id;
              return(
                <g key={i} style={{cursor:"pointer"}} onClick={()=>setCrisisSelected(z.id)}>
                  <rect x={x1} y={PAD_T} width={Math.max(1,x2-x1)} height={plotH}
                    fill={z.color} opacity={isSelected?0.2:0.08}
                    style={{transition:"opacity 0.2s"}}/>
                  {/* Zone label at top */}
                  <text x={(x1+x2)/2} y={PAD_T+10} fontSize={7.5} fill={z.color}
                    textAnchor="middle" opacity={isSelected?1:0.7} fontWeight={isSelected?"700":"400"}>
                    {z.name}
                  </text>
                </g>
              );
            })}

            {/* Threshold lines */}
            {thresholds.map((t,i)=>(
              <g key={i}>
                <line x1={PAD_L} y1={toY(t.v)} x2={W-PAD_R} y2={toY(t.v)}
                  stroke={t.c} strokeWidth={0.7} strokeDasharray="4,3" strokeOpacity={0.5}/>
                <text x={PAD_L-4} y={toY(t.v)+3} fontSize={8} fill={t.c} textAnchor="end" opacity={0.8}>{t.v}</text>
              </g>
            ))}

            {/* VIX line */}
            <path d={linePath} fill="none" stroke="#818cf8" strokeWidth={1.2} opacity={0.9}/>

            {/* Live VIX horizontal line + dot at end of chart */}
            {liveVix&&(
              <g>
                <line x1={PAD_L} y1={toY(liveVix)} x2={W-PAD_R} y2={toY(liveVix)}
                  stroke="#fbbf24" strokeWidth={1} strokeDasharray="3,2" opacity={0.6}/>
                <text x={W-PAD_R+2} y={toY(liveVix)+3} fontSize={8} fill="#fbbf24">NOW {liveVix.toFixed(0)}</text>
                {/* Dot at the rightmost data point */}
                <circle cx={toX(vixData.length-1)} cy={toY(liveVix)} r={4}
                  fill="#fbbf24" stroke="#0a1421" strokeWidth={1.5}/>
              </g>
            )}

            {/* X axis labels */}
            {xLabels.map((l,i)=>(
              <g key={i}>
                <line x1={l.x} y1={PAD_T+plotH} x2={l.x} y2={PAD_T+plotH+4} stroke="#334155" strokeWidth={0.5}/>
                <text x={l.x} y={H-6} fontSize={9} fill="#475569" textAnchor="middle">{l.label}</text>
              </g>
            ))}

            {/* Y axis */}
            <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={PAD_T+plotH} stroke="#1e3a5f" strokeWidth={0.5}/>
          </svg>
        </div>
      )}

      {/* Legend */}
      {!loading&&!error&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:8,fontSize:11,color:"#475569",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:16,height:2,background:"#818cf8",borderRadius:1}}/>
            <span>Daily VIX</span>
          </div>
          {thresholds.map((t,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{width:16,height:1.5,background:t.c,opacity:0.7,borderTop:`1px dashed ${t.c}`}}/>
              <span>{t.label}</span>
            </div>
          ))}
          <div style={{marginLeft:"auto",fontSize:10,color:"#334155"}}>Click any shaded zone to load that crisis below ↓</div>
        </div>
      )}

      {/* ── EARLY WARNING SIGNALS ── */}
      {(()=>{
        if(loading||error||!vixData.length) return null;

        // Compute live signals from VIX data
        const recent = vixData.slice(-30).map(d=>d.val);
        const last   = vixData[vixData.length-1]?.val || 0;
        const prev20 = vixData.slice(-20).map(d=>d.val);
        const ma20   = prev20.reduce((s,v)=>s+v,0)/prev20.length;
        const ma5    = vixData.slice(-5).map(d=>d.val).reduce((s,v)=>s+v,0)/5;
        const prev252= vixData.slice(-252).map(d=>d.val);
        const ma252  = prev252.reduce((s,v)=>s+v,0)/prev252.length;
        const pct95  = [...prev252].sort((a,b)=>a-b)[Math.floor(prev252.length*0.95)];
        const trend  = ma5 - ma20; // positive = rising
        const live   = liveVix || last;

        // 5 signals with status
        const signals = [
          {
            name: "Absolute level",
            desc: "Where VIX sits relative to crisis thresholds",
            value: `${live.toFixed(1)}`,
            status: live>=35?"CRISIS":live>=25?"RISK_OFF":live>=18?"CAUTION":"CALM",
            color: live>=35?"#f87171":live>=25?"#fbbf24":live>=18?"#38bdf8":"#34d399",
            detail: live>=35
              ? `VIX above 35 — full CRISIS regime. Historical context: GFC peaked at 80, COVID at 66. Current level signals severe stress.`
              : live>=25
              ? `VIX 25–35 — elevated fear. Market expecting >1.5% daily moves. Defensive rotation warranted.`
              : live>=18
              ? `VIX 18–25 — caution zone. Normal uncertainty. Monitor for acceleration above 25.`
              : `VIX below 18 — complacency zone. Historically, sustained VIX below 12 often precedes spikes. Low fear = good entry for hedges.`,
            research: "CBOE threshold research; Schwert (2011)"
          },
          {
            name: "20-day trend (momentum)",
            desc: "Is VIX rising or falling? Speed of change matters",
            value: `${trend>=0?"+":""}${trend.toFixed(1)} pts vs 20d MA`,
            status: trend>5?"ACCELERATING":trend>2?"RISING":trend>-2?"FLAT":trend>-5?"FALLING":"COLLAPSING",
            color: trend>5?"#f87171":trend>2?"#fbbf24":trend>-2?"#94a3b8":trend>-5?"#34d399":"#38bdf8",
            detail: trend>5
              ? `VIX rising sharply — ${trend.toFixed(1)} pts above 20d average. Acceleration is a key early warning. In 2008 and 2020, VIX rose 10+ points in a week before the crash deepened.`
              : trend>2
              ? `VIX trending up. Not alarming yet but direction matters. Watch for cross above 25.`
              : trend>-2
              ? `VIX flat. No clear directional signal. Monitor other indicators.`
              : `VIX declining — fear retreating. Typical RISK_ON entry signal when combined with VIX below 20.`,
            research: "VIX momentum: Whaley (2009), CBOE Attribution Report (2025)"
          },
          {
            name: "52-week percentile",
            desc: "How extreme is current VIX vs its own 1-year history?",
            value: `${Math.round(prev252.filter(v=>v<live).length/prev252.length*100)}th percentile`,
            status: (()=>{
              const pct = prev252.filter(v=>v<live).length/prev252.length;
              return pct>=0.95?"EXTREME":pct>=0.80?"ELEVATED":pct>=0.50?"NORMAL":pct>=0.20?"LOW":"SUPPRESSED";
            })(),
            color: (()=>{
              const pct = prev252.filter(v=>v<live).length/prev252.length;
              return pct>=0.95?"#f87171":pct>=0.80?"#fbbf24":pct>=0.50?"#94a3b8":"#34d399";
            })(),
            detail: (()=>{
              const pct = Math.round(prev252.filter(v=>v<live).length/prev252.length*100);
              return pct>=95
                ? `VIX at ${pct}th percentile of past year — extreme. Historically, readings above 95th pct correspond to peak fear and often mark buying opportunities for contrarian investors.`
                : pct>=80
                ? `VIX at ${pct}th percentile — elevated vs recent history. Markets in stress mode. Defensive positioning appropriate.`
                : `VIX at ${pct}th percentile — within normal range for the past year. No percentile signal.`;
            })(),
            research: "Percentile approach: Ang et al. (2006); VIX quantile spillover research (2024)"
          },
          {
            name: "VIX vs long-run mean reversion",
            desc: "VIX always reverts to ~20. Extreme divergence = signal",
            value: `${live.toFixed(1)} vs ${ma252.toFixed(1)} 1yr avg`,
            status: live/ma252>=2?"EXTREME SPIKE":live/ma252>=1.5?"ELEVATED":live/ma252>=0.85?"NORMAL":live/ma252>=0.6?"LOW":"SUPPRESSED",
            color: live/ma252>=2?"#dc2626":live/ma252>=1.5?"#f87171":live/ma252>=0.85?"#94a3b8":"#34d399",
            detail: live/ma252>=2
              ? `VIX is ${(live/ma252).toFixed(1)}x its 1-year average — extreme spike. Mean reversion is powerful: after spikes above 2x average, VIX has historically fallen 40%+ within 3 months. This signals peak fear, often a market bottom.`
              : live/ma252>=1.5
              ? `VIX is ${(live/ma252).toFixed(1)}x its 1-year average — elevated. Stress above normal but not at panic levels. Continue defensive positioning.`
              : live/ma252<=0.6
              ? `VIX is suppressed at ${(live/ma252).toFixed(1)}x average — dangerously low. Complacency is a contrarian warning. Pre-crisis VIX is often at multi-year lows (2006: 10, early 2020: 12).`
              : `VIX near its 1-year average. No mean reversion signal.`,
            research: "Mean reversion: Christoffersen & Jacobs (2004); FRED VIX long-run avg ~20"
          },
          {
            name: "VIX spike rate (3-day change)",
            desc: "Sudden jumps are more dangerous than gradual rises",
            value: (()=>{
              if(vixData.length<4) return "N/A";
              const d3 = vixData[vixData.length-4]?.val||live;
              return `${live>d3?"+":""}${(live-d3).toFixed(1)} pts in 3 days`;
            })(),
            status: (()=>{
              if(vixData.length<4) return "N/A";
              const d3 = vixData[vixData.length-4]?.val||live;
              const chg = live-d3;
              return chg>15?"SHOCK":chg>8?"SPIKE":chg>3?"RISING":chg>-3?"FLAT":"FALLING";
            })(),
            color: (()=>{
              if(vixData.length<4) return "#94a3b8";
              const d3 = vixData[vixData.length-4]?.val||live;
              const chg = live-d3;
              return chg>15?"#dc2626":chg>8?"#f87171":chg>3?"#fbbf24":"#34d399";
            })(),
            detail: (()=>{
              if(vixData.length<4) return "Insufficient data.";
              const d3 = vixData[vixData.length-4]?.val||live;
              const chg = live-d3;
              return chg>15
                ? `VIX jumped ${chg.toFixed(1)} pts in 3 days — shock event. CBOE data shows: April 2025 Liberation Day +23.8 pts, COVID Feb 2020 +30 pts, GFC Oct 2008 +40 pts. Spike of this magnitude = immediate CRISIS regime.`
                : chg>8
                ? `VIX up ${chg.toFixed(1)} pts in 3 days — significant spike. Monitor closely. If sustained above 25, defensive rotation warranted.`
                : chg>3
                ? `VIX up ${chg.toFixed(1)} pts in 3 days — rising. Not a spike yet. Watch for acceleration.`
                : `No significant spike. VIX movement within normal daily variation.`;
            })(),
            research: "Spike rate: CBOE Attribution Report (2025); Whaley (2000) VIX as fear index"
          },
        ];

        // Overall risk score
        let riskScore = 0;
        if(live>=35) riskScore+=3; else if(live>=25) riskScore+=2; else if(live>=18) riskScore+=1;
        if(trend>5) riskScore+=2; else if(trend>2) riskScore+=1;
        const pctRank = prev252.filter(v=>v<live).length/prev252.length;
        if(pctRank>=0.95) riskScore+=2; else if(pctRank>=0.80) riskScore+=1;
        if(live/ma252>=2) riskScore+=2; else if(live/ma252>=1.5) riskScore+=1;
        if(vixData.length>=4){const d3=vixData[vixData.length-4]?.val||live;const chg=live-d3;if(chg>15)riskScore+=3;else if(chg>8)riskScore+=2;else if(chg>3)riskScore+=1;}
        const maxScore = 12;
        const riskPct  = Math.round(riskScore/maxScore*100);
        const riskLabel= riskScore>=9?"CRISIS IMMINENT":riskScore>=6?"HIGH ALERT":riskScore>=3?"ELEVATED":riskScore>=1?"MONITOR":"ALL CLEAR";
        const riskColor= riskScore>=9?"#dc2626":riskScore>=6?"#f87171":riskScore>=3?"#fbbf24":riskScore>=1?"#38bdf8":"#34d399";

        return(
        <div style={{marginTop:12}}>

          {/* Composite risk gauge */}
          <div style={{background:"#060d18",border:`1px solid ${riskColor}44`,borderRadius:12,padding:"14px 18px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontFamily:"Avenir Next,sans-serif",fontWeight:800,fontSize:14,color:"#e2e8f0"}}>
                  🎯 Crisis Early Warning — Composite Signal
                </div>
                <div style={{fontSize:11,color:"#475569",marginTop:2}}>5 independent VIX-based indicators combined · Based on CBOE research & academic literature</div>
              </div>
              <div style={{textAlign:"center"}}>
                <div style={{fontFamily:"Avenir Next,sans-serif",fontWeight:800,fontSize:22,color:riskColor}}>{riskScore}/{maxScore}</div>
                <div style={{fontSize:10,fontWeight:700,color:riskColor,letterSpacing:"0.06em"}}>{riskLabel}</div>
              </div>
            </div>
            {/* Progress bar */}
            <div style={{background:"#0a1421",borderRadius:4,height:8,overflow:"hidden",marginBottom:6}}>
              <div style={{width:riskPct+"%",height:"100%",background:riskColor,borderRadius:4,transition:"width 0.6s ease"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#334155"}}>
              <span>All Clear (0)</span><span>Monitor (1-2)</span><span>Elevated (3-5)</span><span>High Alert (6-8)</span><span>Crisis (9-12)</span>
            </div>
          </div>

          {/* Individual signals */}
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {signals.map((s,i)=>(
              <div key={i} style={{background:"#060d18",border:"1px solid #0d1826",borderRadius:10,padding:"12px 14px",borderLeft:`3px solid ${s.color}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                  <div>
                    <span style={{fontFamily:"Avenir Next,sans-serif",fontWeight:700,fontSize:12,color:"#e2e8f0"}}>{s.name}</span>
                    <span style={{fontSize:10,color:"#334155",marginLeft:6}}>{s.desc}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                    <span style={{fontFamily:"Avenir Next,sans-serif",fontWeight:700,fontSize:12,color:s.color}}>{s.value}</span>
                    <span style={{fontSize:9,fontWeight:700,color:s.color,background:s.color+"22",padding:"2px 7px",borderRadius:4,whiteSpace:"nowrap"}}>{s.status}</span>
                  </div>
                </div>
                <div style={{fontSize:11,color:"#64748b",lineHeight:1.65}}>{s.detail}</div>
                <div style={{fontSize:9,color:"#1e3a5f",marginTop:4}}>Source: {s.research}</div>
              </div>
            ))}
          </div>

          {/* Disclaimer */}
          <div style={{fontSize:10,color:"#1e3a5f",marginTop:8,lineHeight:1.6,textAlign:"center"}}>
            These signals are indicators, not predictions. VIX measures implied volatility — it reflects fear, not the future. No single indicator predicts crashes reliably. StockSense uses these as inputs to the macro regime score, not as standalone triggers.
          </div>
        </div>
        );
      })()}
    </div>
  );
}

                  <div style={{width:36,height:36,background:"rgba(56,189,248,0.12)",border:"1px solid rgba(56,189,248,0.3)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🧮</div>
                  <div>

                  The Quant Score is our overall rating for a stock — a single number from 0 to 100 that summarises whether our mathematical model thinks the stock is a good opportunity right now. Think of it like a credit score, but for stocks.
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:14}}>
                  {[["75–100","Strong Buy","#34d399","All signals aligned. Strong momentum, solid fundamentals, positive macro."],["60–74","Buy","#a3e635","More bullish than bearish. Worth considering for long-term holders."],["45–59","Neutral","#fbbf24","Mixed signals. Neither a clear buy nor a clear sell. Wait for clarity."],["30–44","Sell","#f97316","More bearish than bullish. Risk is elevated. Consider reducing exposure."],["0–29","Strong Sell","#f87171","Multiple pillars flashing red. High risk. Avoid or exit."]].map(([range,label,c,desc],i)=>(
                    <div key={i} style={{background:`${c+"0d"}`,border:`1px solid ${c+"33"}`,borderRadius:10,padding:"10px 12px",textAlign:"center"}}>

                  {[["Trend (25%)","Is the price above or below its moving averages? Is momentum positive or negative?","#38bdf8"],["Momentum (20%)","RSI reading, recent 1-month and 3-month price performance.","#a3e635"],["Volatility (15%)","How calm or turbulent is the stock? Lower volatility = higher score.","#fbbf24"],["Fundamental (25%)","P/E vs sector average, revenue growth, free cash flow yield, debt levels.","#818cf8"],["Macro (15%)","Beta vs market, interest rate sensitivity, sector momentum.","#f97316"]].map(([p,d,c],i)=>(
                    <div key={i} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}>

              </div>

              {/* SECTION 2 — Technical Indicators */}
              <div style={{background:"#0a1421",border:"1px solid #101c2e",borderRadius:14,padding:"20px 22px",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                  <div style={{width:36,height:36,background:"rgba(244,114,182,0.12)",border:"1px solid rgba(244,114,182,0.3)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>📐</div>
                  <div style={{fontFamily:"Avenir Next,Avenir,Nunito,sans-serif",fontWeight:800,fontSize:18,color:"#f472b6"}}>Technical Indicators</div>
                </div>
                {[
                  {name:"Confidence %",color:"#818cf8",what:"Measures how much all 5 quant pillars agree with each other. A high Confidence means Trend, Momentum, Volatility, Fundamental and Macro are all pointing in the same direction. A low Confidence means mixed signals — some pillars bullish, some bearish.",how:"Calculated from the standard deviation of the 5 pillar scores. Low deviation = pillars agree = high confidence. High deviation = pillars disagree = low confidence. Scale 0–100%.",signals:[["Above 70%","Strong agreement across all pillars. The quant signal is reliable and conviction is high.","#34d399"],["40%–70%","Moderate agreement. Some pillars diverge. Trade with normal position sizing.","#fbbf24"],["Below 40%","Pillars conflict significantly. Signal is unreliable. Treat the quant score with caution.","#f87171"]]},
                  {name:"RSI — Relative Strength Index",color:"#f472b6",what:"A momentum indicator that measures how fast and how much a stock's price has moved recently. Scale of 0–100.",how:"Calculated from the average gains vs average losses over the last 14 periods.",signals:[["Above 70","Overbought — stock may have risen too fast. Often a warning sign of a pullback.","#f87171"],["30–70","Normal range — no extreme signals. Healthy trading zone.","#fbbf24"],["Below 30","Oversold — stock may have fallen too fast. Often a potential buying opportunity.","#34d399"]]},
                  {name:"Bollinger Bands (%B)",color:"#fbbf24",what:"Three lines plotted around the price: a middle moving average, and upper/lower bands 2 standard deviations away. %B shows where the price is within those bands.",how:"Upper band = 20-day MA + 2x standard deviation. Lower band = 20-day MA − 2x standard deviation. %B = (Price − Lower) / (Upper − Lower) × 100.",signals:[["Above 80%","Near upper band — price stretched to the upside. Mean reversion (pullback) likely.","#f87171"],["20%–80%","Mid-band — price trading in normal range.","#fbbf24"],["Below 20%","Near lower band — price stretched to the downside. Potential bounce zone.","#34d399"]]},
                  {name:"MACD — Moving Average Convergence Divergence",color:"#f97316",what:"Shows the relationship between two moving averages of the price. Used to spot momentum shifts and potential trend reversals.",how:"MACD Line = 12-day EMA − 26-day EMA. Signal Line = 9-day EMA of MACD Line. Histogram = MACD − Signal.",signals:[["Histogram positive (green)","Bullish momentum — MACD above signal line. Upward pressure.","#34d399"],["Histogram negative (red)","Bearish momentum — MACD below signal line. Downward pressure.","#f87171"],["Crossover","When MACD crosses the signal line — often signals a trend change.","#fbbf24"]]},
                  {name:"MA50 / MA200 — Moving Averages",color:"#38bdf8",what:"The average closing price over the last 50 or 200 periods. Smooths out noise and shows the underlying trend direction.",how:"Sum of last 50 (or 200) closing prices ÷ 50 (or 200).",signals:[["Price above MA50","Short-term bullish trend. Stock is trading above its recent average.","#34d399"],["Price above MA200","Long-term bullish trend. The most important trend signal.","#34d399"],["Golden Cross","MA50 crosses above MA200 — historically very bullish long-term signal.","#34d399"],["Death Cross","MA50 crosses below MA200 — historically bearish long-term signal.","#f87171"]]},
                  {name:"Volume",color:"#34d399",what:"The number of shares traded in a period. Confirms whether a price move is backed by real conviction.",how:"Directly reported by exchanges. Shown as bars below the candlestick chart.",signals:[["High volume + price up","Strong buying conviction. Bullish move more likely to continue.","#34d399"],["High volume + price down","Strong selling conviction. Bearish move more likely to continue.","#f87171"],["Low volume","Weak conviction. Price move may not be sustained. Treat with caution.","#fbbf24"]]},
                ].map((ind,i)=>(
                  <div key={i} style={{borderBottom:"1px solid #101c2e",paddingBottom:16,marginBottom:16}}>
                    <div style={{fontFamily:"Avenir Next,Avenir,Nunito,sans-serif",fontWeight:800,fontSize:18,color:ind.color,marginBottom:8}}>{ind.name}</div>

                  {t:"Buy / Hold / Sell ratings",d:"Buy = the analyst thinks the stock will outperform the market and rise meaningfully. Hold = fairly valued — neither a buy nor a sell. Sell = the analyst thinks the stock is overvalued and likely to fall. Strong Buy = highest conviction buy rating."},

                  {t:"EPS — Earnings Per Share",d:"EPS is the company's profit divided by the number of shares. Analysts publish estimates before each earnings report. 'Beat' means the actual result was higher than expected — usually causes the stock to rise. 'Miss' means results were below expectations — usually causes the stock to fall."},
                  {t:"Why does earnings matter so much?",d:"Earnings reports are the single biggest one-day price mover for most stocks. A large beat can push a stock up 10–20% in one day. A large miss can drop it just as fast. Knowing the next earnings date helps you plan — some investors avoid holding through earnings due to the uncertainty."},
                ].map((item,i)=>(

                  {t:"Beta",d:"Measures how much the stock moves relative to the overall market (S&P 500 = beta 1.0). Beta of 1.5 means the stock tends to move 50% more than the market — up more in bull markets, down more in bear markets. Beta below 1 means calmer than market."},
                  {t:"Volatility Regime — Compressing 🧊",d:"Recent volatility is falling below its historical average. The stock is settling down. This often precedes a significant move (breakout) in either direction. Generally lower short-term risk."},
                  {t:"Volatility Regime — Stable ➡️",d:"Volatility is within its normal historical range. No unusual signals. Average price swings expected."},
                  {t:"Volatility Regime — Expanding 💥",d:"Recent volatility is rising above its historical average. Larger price swings are expected. This is a warning sign — positions may need to be sized smaller to account for the increased risk."},
                  {t:"Risk-Adjusted Return",d:"Expected annual return divided by volatility. A stock returning 20% with 10% volatility has a risk-adjusted return of 2.0 — much better than a stock returning 30% with 60% volatility (0.5). Higher is better. This is similar to the Sharpe Ratio concept used by professional fund managers."},
                ].map((item,i)=>(
                  <div key={i} style={{display:"flex",gap:12,background:"#090f1a",borderRadius:10,padding:"12px 14px",marginBottom:8,borderLeft:"3px solid #fbbf24"}}>

                  <div style={{width:36,height:36,background:"rgba(129,140,248,0.12)",border:"1px solid rgba(129,140,248,0.3)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>💰</div>

                {[
                  {t:"Income Statement",d:"Shows how much money the company made (revenue), spent (costs), and kept as profit (net income) over a period. Key line: Net Income — the bottom line profit. EPS (Earnings Per Share) = Net Income ÷ shares outstanding."},
                  {t:"Balance Sheet",d:"A snapshot of what the company owns (assets) and what it owes (liabilities) at a specific date. Equity = Assets − Liabilities — what belongs to shareholders. High debt relative to equity can be a risk."},
                  {t:"Cash Flow Statement",d:"Tracks actual cash moving in and out of the business. Profit on paper doesn't always mean cash in the bank. Free Cash Flow (FCF) = Operating Cash Flow − Capital Expenditure. FCF is the truest measure of a company's financial health."},
                  {t:"YoY (Year-over-Year)",d:"The percentage change from one year to the same period the previous year. Green YoY = growing. Red YoY = shrinking. Consistent revenue growth YoY is one of the strongest signs of a healthy business."},

                  {t:"How predictions are calculated",d:"Our model uses three inputs: (1) the 10-year compound annual growth rate (CAGR) of the stock, (2) the most recent 3-year average return, and (3) an adjustment based on the Quant Score. These are blended into an expected annual return, then scaled to daily, weekly, monthly, and yearly targets."},

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  {[
                    {l:"Live Prices",v:"Finnhub.io — real-time US market data",s:"✅ Real-time",c:"#34d399"},
